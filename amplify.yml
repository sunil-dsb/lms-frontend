version: 1
frontend:
  phases:
    preBuild:
      commands:
        - pnpm install
    build:
      commands:
        - test -n "$OPENROUTER_API_KEY" || (echo "OPENROUTER_API_KEY is EMPTY in build env" && exit 1)
        - echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env.production
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/* 